[package]
name = "gettics-comic-manga-reader"
version = "0.0.1"
description = "Gettic's Comic-Manga reader"
edition = "2021"
publish = false

[lib]
name = "comic_reader_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev.package."*"]
opt-level = 2
